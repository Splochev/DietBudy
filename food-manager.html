<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DietBuddy – Food Database</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div x-data x-init="$store.diet.init()" style="display:flex;flex-direction:column;height:100vh">

      <!-- ══ LOADING ══════════════════════════════════════════════ -->
      <template x-if="$store.diet.authState === 'loading'">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)">
          <div style="text-align:center;color:var(--text3)">
            <svg style="width:40px;height:40px;color:var(--accent);animation:pulse 1.5s infinite;margin-bottom:12px"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="6" y1="2" x2="6" y2="9"/>
              <line x1="9" y1="2" x2="9" y2="9"/>
              <path d="M6 9 Q7.5 12 9 9"/>
              <line x1="7.5" y1="12" x2="7.5" y2="22"/>
              <ellipse cx="16.5" cy="6" rx="2.5" ry="4"/>
              <line x1="16.5" y1="10" x2="16.5" y2="22"/>
            </svg>
            <p style="font-size:0.9rem">Loading…</p>
          </div>
        </div>
      </template>

      <!-- ══ APP SHELL ═════════════════════════════════════════════ -->
      <template x-if="$store.diet.authState === 'authenticated'">
        <div style="display:flex;flex-direction:column;height:100vh">

          <!-- ═ TOP BAR ═══════════════════════════════════════════ -->
          <header id="topbar" style="display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0">
            <!-- Sidebar toggle -->
            <button class="btn-icon" @click="$store.diet.sidebarOpen = !$store.diet.sidebarOpen" title="Toggle sidebar">
              <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12h18M3 6h18M3 18h18"/>
              </svg>
            </button>

            <!-- Logo -->
            <div style="display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:700;color:var(--accent);letter-spacing:-0.5px;flex-shrink:0">
              <svg style="width:24px;height:24px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="6" y1="2" x2="6" y2="9"/>
                <line x1="9" y1="2" x2="9" y2="9"/>
                <path d="M6 9 Q7.5 12 9 9"/>
                <line x1="7.5" y1="12" x2="7.5" y2="22"/>
                <ellipse cx="16.5" cy="6" rx="2.5" ry="4"/>
                <line x1="16.5" y1="10" x2="16.5" y2="22"/>
              </svg>
              DietBuddy
            </div>

            <!-- Nav tabs -->
            <nav style="display:flex;gap:4px;margin-left:8px">
              <!-- Foods (active) -->
              <a href="./food-manager.html"
                style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:4px;font-size:0.8rem;font-weight:500;color:var(--accent);background:var(--accent-bg);text-decoration:none">
                <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="6" y1="2" x2="6" y2="9"/>
                  <line x1="9" y1="2" x2="9" y2="9"/>
                  <path d="M6 9 Q7.5 12 9 9"/>
                  <line x1="7.5" y1="12" x2="7.5" y2="22"/>
                  <ellipse cx="16.5" cy="6" rx="2.5" ry="4"/>
                  <line x1="16.5" y1="10" x2="16.5" y2="22"/>
                </svg>
                <span x-text="$store.diet.t('nav_foods')"></span>
              </a>
              <!-- Planner -->
              <a href="./planner.html"
                style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:4px;font-size:0.8rem;font-weight:500;color:var(--text3);text-decoration:none;transition:var(--trans)"
                onmouseover="this.style.color='var(--text)';this.style.background='var(--surface2)'"
                onmouseout="this.style.color='var(--text3)';this.style.background='transparent'">
                <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                  <line x1="8" y1="14" x2="16" y2="14"/>
                </svg>
                <span x-text="$store.diet.t('nav_planner')"></span>
              </a>
              <a href="./weight-tracker.html"
                style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:4px;font-size:0.8rem;font-weight:500;color:var(--text3);text-decoration:none;transition:var(--trans)"
                onmouseover="this.style.color='var(--text)';this.style.background='var(--surface2)'"
                onmouseout="this.style.color='var(--text3)';this.style.background='transparent'">
                <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-6"/></svg>
                Weight
              </a>
              <!-- Workouts (cross-app) -->
              <a href="https://splochev.github.io/GymBudy/workout.html"
                style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:4px;font-size:0.8rem;font-weight:500;color:var(--text3);text-decoration:none;transition:var(--trans)"
                onmouseover="this.style.color='var(--text)';this.style.background='var(--surface2)'"
                onmouseout="this.style.color='var(--text3)';this.style.background='transparent'">
                <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="9" width="3" height="6" rx="1"/>
                  <rect x="19" y="9" width="3" height="6" rx="1"/>
                  <rect x="5" y="7" width="3" height="10" rx="1"/>
                  <rect x="16" y="7" width="3" height="10" rx="1"/>
                  <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                <span x-text="$store.diet.t('nav_workouts')"></span>
              </a>
              <!-- Budget (cross-app) -->
              <a href="https://splochev.github.io/budgetBuddy/budget.html"
                style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:4px;font-size:0.8rem;font-weight:500;color:var(--text3);text-decoration:none;transition:var(--trans)"
                onmouseover="this.style.color='var(--text)';this.style.background='var(--surface2)'"
                onmouseout="this.style.color='var(--text3)';this.style.background='transparent'">
                <svg style="width:14px;height:14px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/>
                </svg>
                <span x-text="$store.diet.lang === 'bg' ? 'Бюджет' : 'Budget'"></span>
              </a>
            </nav>

            <div style="flex:1"></div>

            <!-- Lang toggle + User + logout -->
            <button class="btn btn-ghost btn-sm" style="font-size:0.75rem;padding:4px 10px"
              @click="$store.diet.setLang($store.diet.lang === 'en' ? 'bg' : 'en')"
              x-text="$store.diet.lang === 'en' ? 'EN' : 'BG'"></button>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:0.8rem;color:var(--text3)" x-text="$store.diet.user?.displayName || $store.diet.user?.email?.split('@')[0]"></span>
              <button class="btn-icon" @click="$store.diet.logout()" :title="$store.diet.t('sign_out')">
                <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                  <polyline points="16 17 21 12 16 7"/>
                  <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
              </button>
            </div>
          </header>

          <!-- ═ BODY ═══════════════════════════════════════════════ -->
          <div style="display:flex;flex:1;overflow:hidden;position:relative">

            <!-- ═ SIDEBAR ════════════════════════════════════════ -->
            <aside id="sidebar" :class="{ open: $store.diet.sidebarOpen }"
              style="background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden">

              <!-- Mobile header -->
              <div class="sidebar-mobile-header" style="display:none;flex-direction:column;flex-shrink:0">
                <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)">
                  <div style="display:flex;align-items:center;gap:8px;font-size:1.1rem;font-weight:700;color:var(--accent)">
                    <svg style="width:22px;height:22px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="6" y1="2" x2="6" y2="9"/>
                      <line x1="9" y1="2" x2="9" y2="9"/>
                      <path d="M6 9 Q7.5 12 9 9"/>
                      <line x1="7.5" y1="12" x2="7.5" y2="22"/>
                      <ellipse cx="16.5" cy="6" rx="2.5" ry="4"/>
                      <line x1="16.5" y1="10" x2="16.5" y2="22"/>
                    </svg>
                    DietBuddy
                  </div>
                  <button class="btn-icon" @click="$store.diet.sidebarOpen = false">
                    <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                  </button>
                </div>
                <!-- Mobile nav -->
                <div style="display:flex;flex-direction:column;padding:8px;border-bottom:1px solid var(--border);gap:2px">
                  <a href="./food-manager.html" style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius);background:var(--accent-bg);color:var(--accent);font-size:0.875rem;font-weight:600;text-decoration:none">
                    <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="2" x2="6" y2="9"/><line x1="9" y1="2" x2="9" y2="9"/><path d="M6 9 Q7.5 12 9 9"/><line x1="7.5" y1="12" x2="7.5" y2="22"/><ellipse cx="16.5" cy="6" rx="2.5" ry="4"/><line x1="16.5" y1="10" x2="16.5" y2="22"/></svg>
                    <span x-text="$store.diet.t('nav_foods')"></span>
                  </a>
                  <a href="./planner.html" style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius);color:var(--text3);font-size:0.875rem;font-weight:500;text-decoration:none">
                    <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span x-text="$store.diet.t('nav_planner')"></span>
                  </a>
                  <a href="./weight-tracker.html" style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius);color:var(--text3);font-size:0.875rem;font-weight:500;text-decoration:none">
                    <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-6"/></svg>
                    Weight Tracker
                  </a>
                  <a href="https://splochev.github.io/GymBudy/workout.html" style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius);color:var(--text3);font-size:0.875rem;font-weight:500;text-decoration:none">
                    <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="5" y="7" width="3" height="10" rx="1"/><rect x="16" y="7" width="3" height="10" rx="1"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    <span x-text="$store.diet.t('nav_workouts')"></span>
                  </a>
                  <a href="https://splochev.github.io/budgetBuddy/budget.html" style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius);color:var(--text3);font-size:0.875rem;font-weight:500;text-decoration:none">
                    <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/></svg>
                    <span x-text="$store.diet.lang === 'bg' ? 'Бюджет' : 'Budget'"></span>
                  </a>
                </div>
              </div>

              <!-- Meal Plans section -->
              <div style="padding:12px 16px;border-bottom:1px solid var(--border)">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                  <span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:600" x-text="$store.diet.t('meal_plans_label')"></span>
                  <a href="./planner.html" class="btn-icon" style="width:24px;height:24px" title="New meal plan">
                    <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                  </a>
                </div>
                <div style="display:flex;flex-direction:column;gap:2px">
                  <template x-for="plan in $store.diet.mealPlans" :key="plan.id">
                    <a :href="'./planner.html?plan=' + plan.id" :title="plan.name" class="sidebar-item" style="text-decoration:none;color:var(--text)">
                      <span x-text="plan.name" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.85rem"></span>
                      <span style="font-size:0.7rem;color:var(--text3)" x-text="plan.targetCalories ? plan.targetCalories + ' kcal' : ''"></span>
                    </a>
                  </template>
                  <div x-show="!$store.diet.mealPlans.length" style="font-size:0.8rem;color:var(--text3);padding:8px 12px" x-text="$store.diet.t('no_plans_sidebar')"></div>
                </div>
              </div>

              <!-- Mobile user footer (pinned to bottom of drawer) -->
              <div class="sidebar-mobile-header"
                style="display:none;flex-direction:column;flex-shrink:0;border-top:1px solid var(--border);padding:12px 16px;gap:6px">
                <span style="font-size:0.78rem;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="$store.diet.user?.displayName || $store.diet.user?.email?.split('@')[0]"></span>
                <div style="display:flex;gap:6px;align-items:center">
                  <button class="btn btn-ghost btn-sm" style="font-size:0.75rem;padding:3px 8px"
                    @click="$store.diet.setLang($store.diet.lang === 'en' ? 'bg' : 'en')"
                    x-text="$store.diet.lang === 'en' ? 'EN' : 'BG'"></button>
                  <button class="btn-icon" @click="$store.diet.logout()" :title="$store.diet.t('sign_out')">
                    <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                      <polyline points="16 17 21 12 16 7"/>
                      <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                  </button>
                </div>
              </div>
            </aside>

            <!-- Mobile overlay — closes sidebar when tapped -->
            <div id="sidebar-overlay" @click="$store.diet.sidebarOpen = false"></div>

            <!-- ═ MAIN CONTENT ═══════════════════════════════════ -->
            <main id="food-main" style="flex:1;overflow:auto;padding:16px">

              <!-- Page header -->
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px">
                <div>
                  <h1 style="font-size:1.25rem;font-weight:700;margin-bottom:2px" x-text="$store.diet.t('food_database_title')"></h1>
                  <p style="color:var(--text3);font-size:0.85rem" x-text="$store.diet.t('food_database_desc')"></p>
                </div>
                <button class="btn btn-primary" @click="$store.diet.openModal('addFood')">
                  <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                  <span x-text="$store.diet.t('btn_add_food')"></span>
                </button>
              </div>

              <!-- Search bar -->
              <div style="position:relative;margin-bottom:16px">
                <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text3)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input x-model="$store.diet.foodSearch" @input="$store.diet.foodPage = 1" :placeholder="$store.diet.t('search_placeholder')" style="width:100%;padding-left:34px" />
              </div>

              <!-- Table -->
              <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
                <table class="food-table">
                  <thead>
                    <tr>
                      <th style="width:32px"></th>
                      <th x-text="$store.diet.t('col_name')"></th>
                      <th class="food-col-sm" style="text-align:right"><span x-text="$store.diet.t('col_calories')"></span><br><span style="font-size:0.6rem;font-weight:400" x-text="$store.diet.t('col_per_100g')"></span></th>
                      <th style="text-align:right"><span x-text="$store.diet.t('col_protein')"></span><br><span style="font-size:0.6rem;font-weight:400" x-text="$store.diet.t('col_per_100g')"></span></th>
                      <th class="food-col-md" style="text-align:right"><span x-text="$store.diet.t('col_fats')"></span><br><span style="font-size:0.6rem;font-weight:400" x-text="$store.diet.t('col_per_100g')"></span></th>
                      <th class="food-col-md" style="text-align:right"><span x-text="$store.diet.t('col_carbs')"></span><br><span style="font-size:0.6rem;font-weight:400" x-text="$store.diet.t('col_per_100g')"></span></th>
                      <th class="food-col-md" style="text-align:right"><span x-text="$store.diet.t('col_weight')"></span><br><span style="font-size:0.6rem;font-weight:400" x-text="$store.diet.t('col_weight_unit')"></span></th>
                      <th style="text-align:right" x-text="$store.diet.t('col_price')"></th>
                      <th class="food-col-sm" style="text-align:right" x-text="$store.diet.t('col_price_100g')"></th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="food in $store.diet.pagedFoods" :key="food.id">
                      <tr :style="food.flagged ? 'background:var(--accent-bg);border-left:3px solid var(--accent)' : 'border-left:3px solid transparent'">
                        <td style="width:32px;text-align:center;padding:0 8px">
                          <input type="checkbox" :checked="food.flagged" @change="$store.diet.toggleFoodFlag(food)" style="cursor:pointer;width:14px;height:14px">
                        </td>
                        <td>
                          <span style="font-weight:500" x-text="food.name"></span>
                          <span x-show="food.priceType === 'per_kg'" class="badge" style="margin-left:6px;font-size:0.6rem;padding:2px 6px">/kg</span>
                        </td>
                        <td class="food-col-sm" style="text-align:right;color:var(--text2)" x-text="food.calories || '—'"></td>
                        <td style="text-align:right;color:var(--accent);font-weight:600" x-text="food.protein ? food.protein + 'g' : '—'"></td>
                        <td class="food-col-md" style="text-align:right;color:var(--text3)" x-text="food.fats ? food.fats + 'g' : '—'"></td>
                        <td class="food-col-md" style="text-align:right;color:var(--text3)" x-text="food.carbs ? food.carbs + 'g' : '—'"></td>
                        <td class="food-col-md" style="text-align:right;color:var(--text2)" x-text="food.packageWeight ? food.packageWeight + 'g' : '—'"></td>
                        <td style="text-align:right;color:var(--text2);white-space:nowrap" x-text="food.price ? food.price.toFixed(2) + ' €' : '—'"></td>
                        <td class="food-col-sm" style="text-align:right;font-size:0.8rem;color:var(--text3)" x-text="$store.diet.formatPricePer100g(food)"></td>
                        <td style="text-align:right">
                          <div style="display:flex;gap:4px;justify-content:flex-end">
                            <button class="btn-icon" style="width:28px;height:28px" title="Edit" @click="$store.diet.openModal('editFood', food.id)">
                              <svg style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                              </svg>
                            </button>
                            <button class="btn-icon" style="width:28px;height:28px;color:var(--danger)" title="Delete" @click="$store.diet.openModal('deleteFood', food.id)">
                              <svg style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                              </svg>
                            </button>
                          </div>
                        </td>
                      </tr>
                    </template>
                    <!-- Empty state -->
                    <tr x-show="!$store.diet.filteredFoods.length">
                      <td colspan="10">
                        <div class="empty-state">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M5 11 Q5 19 12 19 Q19 19 19 11"/>
                            <line x1="4" y1="11" x2="20" y2="11"/>
                            <line x1="12" y1="19" x2="12" y2="22"/>
                            <line x1="9" y1="22" x2="15" y2="22"/>
                          </svg>
                          <p style="font-size:1rem;font-weight:600;margin-bottom:6px" x-text="$store.diet.foodSearch ? $store.diet.t('no_foods_match') : $store.diet.t('no_foods_yet')"></p>
                          <p style="font-size:0.85rem" x-text="$store.diet.foodSearch ? $store.diet.t('no_foods_search_hint') : $store.diet.t('no_foods_hint')"></p>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- Pagination -->
              <div x-show="$store.diet.totalFoodPages > 1" style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px">
                <button class="btn btn-secondary" style="padding:4px 12px;font-size:0.8rem"
                  :disabled="$store.diet.foodPage === 1"
                  @click="$store.diet.foodPage--">&#8249; Prev</button>
                <span style="font-size:0.85rem;color:var(--text3)">
                  <span x-text="$store.diet.foodPage"></span> / <span x-text="$store.diet.totalFoodPages"></span>
                </span>
                <button class="btn btn-secondary" style="padding:4px 12px;font-size:0.8rem"
                  :disabled="$store.diet.foodPage >= $store.diet.totalFoodPages"
                  @click="$store.diet.foodPage++">Next &#8250;</button>
              </div>
            </main>
          </div><!-- /body -->

          <!-- ═ MODALS ══════════════════════════════════════════════ -->

          <!-- Add / Edit Food Modal -->
          <template x-if="$store.diet.modal === 'addFood' || $store.diet.modal === 'editFood'">
            <div style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px" @click.self="$store.diet.closeModal()">
              <div class="modal-box" @click.stop>
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
                  <h2 style="font-size:1rem;font-weight:700" x-text="$store.diet.modal === 'addFood' ? $store.diet.t('add_food_title') : $store.diet.t('edit_food_title')"></h2>
                  <button class="btn-icon" @click="$store.diet.closeModal()">
                    <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                  </button>
                </div>

                <div class="form-group">
                  <label class="form-label" x-text="$store.diet.t('label_food_name')"></label>
                  <input x-model="$store.diet.foodForm.name" :placeholder="$store.diet.t('placeholder_food_name')" />
                </div>

                <div class="form-row form-row-2">
                  <div>
                    <label class="form-label" x-text="$store.diet.t('label_calories_per100')"></label>
                    <input type="number" x-model.number="$store.diet.foodForm.calories" placeholder="0" min="0" />
                  </div>
                  <div>
                    <label class="form-label" x-text="$store.diet.t('label_protein_per100')"></label>
                    <input type="number" x-model.number="$store.diet.foodForm.protein" placeholder="0" min="0" step="0.1" />
                  </div>
                </div>

                <div class="form-row form-row-2">
                  <div>
                    <label class="form-label" x-text="$store.diet.t('label_fats_per100')"></label>
                    <input type="number" x-model.number="$store.diet.foodForm.fats" placeholder="0" min="0" step="0.1" />
                  </div>
                  <div>
                    <label class="form-label" x-text="$store.diet.t('label_carbs_per100')"></label>
                    <input type="number" x-model.number="$store.diet.foodForm.carbs" placeholder="0" min="0" step="0.1" />
                  </div>
                </div>

                <div class="form-row form-row-2">
                  <div>
                    <label class="form-label" x-text="$store.diet.t('label_pkg_weight')"></label>
                    <input type="number" x-model.number="$store.diet.foodForm.packageWeight" placeholder="e.g. 500" min="0" />
                  </div>
                  <div>
                    <label class="form-label" x-text="$store.diet.t('label_price')"></label>
                    <input type="number" x-model.number="$store.diet.foodForm.price" placeholder="0.00" min="0" step="0.01" />
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label" x-text="$store.diet.t('label_price_type')"></label>
                  <select x-model="$store.diet.foodForm.priceType">
                    <option value="per_package" x-text="$store.diet.t('price_per_package')"></option>
                    <option value="per_kg" x-text="$store.diet.t('price_per_kg')"></option>
                  </select>
                </div>

                <!-- Live preview -->
                <div x-show="$store.diet.foodForm.calories || $store.diet.foodForm.protein"
                  style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;font-size:0.8rem">
                  <div style="color:var(--text3);margin-bottom:4px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px">Preview</div>
                  <div style="display:flex;gap:16px;flex-wrap:wrap">
                    <span><span style="color:var(--text3)">Cal: </span><span style="color:var(--text);font-weight:600" x-text="$store.diet.foodForm.calories || 0"></span></span>
                    <span><span style="color:var(--text3)">Prot: </span><span style="color:var(--accent);font-weight:600" x-text="($store.diet.foodForm.protein || 0) + 'g'"></span></span>
                    <span x-show="$store.diet.foodForm.fats"><span style="color:var(--text3)">Fat: </span><span x-text="($store.diet.foodForm.fats || 0) + 'g'"></span></span>
                    <span x-show="$store.diet.foodForm.carbs"><span style="color:var(--text3)">Carbs: </span><span x-text="($store.diet.foodForm.carbs || 0) + 'g'"></span></span>
                    <span x-show="$store.diet.previewPricePer100g"><span style="color:var(--text3)">₽/100g: </span><span x-text="$store.diet.previewPricePer100g"></span></span>
                  </div>
                </div>

                <div x-show="$store.diet.formError" class="error-box" x-text="$store.diet.formError"></div>

                <div style="display:flex;gap:10px;justify-content:flex-end">
                  <button class="btn btn-secondary" @click="$store.diet.closeModal()" x-text="$store.diet.t('cancel')"></button>
                  <button class="btn btn-primary" @click="$store.diet.submitFoodForm()" :disabled="$store.diet.saving">
                    <span x-show="!$store.diet.saving" x-text="$store.diet.modal === 'addFood' ? $store.diet.t('btn_add_food_submit') : $store.diet.t('btn_save_changes')"></span>
                    <span x-show="$store.diet.saving" x-text="$store.diet.t('btn_saving')"></span>
                  </button>
                </div>
              </div>
            </div>
          </template>

          <!-- Delete Food Modal -->
          <template x-if="$store.diet.modal === 'deleteFood'">
            <div style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px" @click.self="$store.diet.closeModal()">
              <div class="modal-box" style="max-width:380px" @click.stop>
                <h2 style="font-size:1rem;font-weight:700;margin-bottom:8px" x-text="$store.diet.t('delete_food_title')"></h2>
                <p style="color:var(--text3);font-size:0.875rem;margin-bottom:20px">
                  <span x-text="$store.diet.selectedFood?.name"></span>? <span x-text="$store.diet.t('confirm_delete_food')"></span>
                </p>
                <div style="display:flex;gap:10px;justify-content:flex-end">
                  <button class="btn btn-secondary" @click="$store.diet.closeModal()" x-text="$store.diet.t('cancel')"></button>
                  <button class="btn btn-danger" @click="$store.diet.confirmDeleteFood()" :disabled="$store.diet.saving">
                    <span x-show="!$store.diet.saving" x-text="$store.diet.t('delete')"></span>
                    <span x-show="$store.diet.saving" x-text="$store.diet.t('deleting')"></span>
                  </button>
                </div>
              </div>
            </div>
          </template>

          <!-- ═ TOASTS ══════════════════════════════════════════════ -->
          <div style="position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:200">
            <template x-for="toast in $store.diet.toasts" :key="toast.id">
              <div class="toast" :class="toast.type === 'error' ? 'toast-error' : 'toast-success'">
                <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <template x-if="toast.type !== 'error'"><path d="M20 6L9 17l-5-5"/></template>
                  <template x-if="toast.type === 'error'"><path d="M18 6L6 18M6 6l12 12"/></template>
                </svg>
                <span x-text="toast.msg"></span>
              </div>
            </template>
          </div>

        </div><!-- /app shell -->
      </template>
    </div><!-- /root -->

    <style>
      #food-main { padding: 16px; }
      @media (min-width: 768px) { #food-main { padding: 20px 24px; } }
      #sidebar { flex-shrink:0; width:0; overflow:hidden; transition: width 0.25s ease; }
      #sidebar.open { width: 280px; }
      @media (max-width: 700px) {
        #topbar > *:nth-child(n + 3) { display: none !important; }
        #sidebar { position:fixed; top:0; left:0; height:100vh; z-index:200; box-shadow:none; transition: width 0.25s ease, box-shadow 0.25s ease; }
        #sidebar.open { width: min(300px, 85vw); box-shadow: 4px 0 32px rgba(0,0,0,0.6); }
        #sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:199; }
        #sidebar.open ~ #sidebar-overlay, body:has(#sidebar.open) #sidebar-overlay { display:block; }
        .sidebar-mobile-header { display: flex !important; }
      }
      @media (min-width: 701px) { .sidebar-mobile-header { display: none !important; } }
    </style>
    <script type="module">
      import Alpine from "https://cdn.jsdelivr.net/npm/alpinejs@3/dist/module.esm.js";
      import { auth } from "./js/firebase.js";
      import * as DB from "./js/db.js";
      import { pricePer100g, round } from "./js/utils.js";
      import { translations } from "./js/i18n.js";
      import {
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

      Alpine.store("diet", {
        // ── Auth ──────────────────────────────────────────────
        authState: "loading",  // loading | authenticated
        user: null,

        // ── Data ──────────────────────────────────────────────
        foods: [],
        mealPlans: [],
        foodSearch: "",
        foodPage: 1,
        foodPageSize: 20,

        // ── UI ────────────────────────────────────────────────
        sidebarOpen: window.innerWidth >= 769,
        modal: null,
        saving: false,
        formError: "",
        toasts: [],

        // ── i18n ──────────────────────────────────────────────
        lang: localStorage.getItem("dietbuddy-lang") || "en",
        t(key) { const tr = translations[this.lang] ?? translations.en; return tr[key] ?? translations.en[key] ?? key; },
        setLang(code) { this.lang = code; localStorage.setItem("dietbuddy-lang", code); },

        // ── Food form ─────────────────────────────────────────
        foodForm: {
          name: "", calories: 0, protein: 0, fats: 0, carbs: 0,
          packageWeight: 0, price: 0, priceType: "per_package"
        },
        editingFoodId: null,

        // ── Init ──────────────────────────────────────────────
        init() {
          onAuthStateChanged(auth, async (user) => {
            if (user) {
              this.user = user;
              this.authState = "authenticated";
              DB.saveUserProfile(user.uid, user.email).catch(() => {});
              await this.loadData();
            } else {
              window.location.href = "./index.html";
            }
          });
        },

        async loadData() {
          try {
            const [foods, plans] = await Promise.all([
              DB.getFoods(this.user.uid),
              DB.getMealPlans(this.user.uid),
            ]);
            this.foods = foods;
            this.mealPlans = plans;
          } catch (e) {
            this.toast("Failed to load data: " + e.message, "error");
          }
        },

        // ── Auth ──────────────────────────────────────────────
        async logout() {
          await signOut(auth);
          // onAuthStateChanged fires → redirects to index.html
        },

        // ── Computed ──────────────────────────────────────────
        get filteredFoods() {
          const q = this.foodSearch.toLowerCase().trim();
          if (!q) return this.foods;
          return this.foods.filter(f => f.name.toLowerCase().includes(q));
        },

        get pagedFoods() {
          const start = (this.foodPage - 1) * this.foodPageSize;
          return this.filteredFoods.slice(start, start + this.foodPageSize);
        },

        get totalFoodPages() {
          return Math.max(1, Math.ceil(this.filteredFoods.length / this.foodPageSize));
        },

        get avgProtein() {
          if (!this.foods.length) return 0;
          return round(this.foods.reduce((s, f) => s + (f.protein || 0), 0) / this.foods.length, 1);
        },

        get avgCalories() {
          if (!this.foods.length) return 0;
          return round(this.foods.reduce((s, f) => s + (f.calories || 0), 0) / this.foods.length, 0);
        },

        get selectedFood() {
          return this.foods.find(f => f.id === this.editingFoodId) || null;
        },

        get previewPricePer100g() {
          const pp = pricePer100g(this.foodForm);
          return pp != null ? round(pp, 3) + " €" : "";
        },

        // ── Format helpers ────────────────────────────────────
        formatPricePer100g(food) {
          const pp = pricePer100g(food);
          return pp != null ? round(pp, 3) + " €" : "—";
        },

        // ── Modal management ──────────────────────────────────
        openModal(name, foodId = null) {
          this.modal = name;
          this.formError = "";
          this.editingFoodId = foodId;
          if (name === "addFood") {
            this.foodForm = { name: "", calories: 0, protein: 0, fats: 0, carbs: 0, packageWeight: 0, price: 0, priceType: "per_package" };
          } else if (name === "editFood" && foodId) {
            const food = this.foods.find(f => f.id === foodId);
            if (food) this.foodForm = { ...food };
          }
        },

        closeModal() {
          this.modal = null;
          this.formError = "";
          this.editingFoodId = null;
        },

        // ── Food CRUD ─────────────────────────────────────────
        async submitFoodForm() {
          this.formError = "";
          if (!this.foodForm.name.trim()) {
            this.formError = "Food name is required.";
            return;
          }
          if (!this.foodForm.calories && !this.foodForm.protein) {
            this.formError = "Please enter at least calories or protein.";
            return;
          }
          this.saving = true;
          try {
            if (this.modal === "addFood") {
              const newFood = await DB.addFood(this.user.uid, this.foodForm);
              this.foods = [...this.foods, newFood].sort((a, b) => a.name.localeCompare(b.name));
              this.toast(this.t("toast_food_added"));
            } else {
              await DB.updateFood(this.user.uid, this.editingFoodId, this.foodForm);
              this.foods = this.foods.map(f =>
                f.id === this.editingFoodId ? { ...f, ...this.foodForm } : f
              );
              this.toast(this.t("toast_food_updated"));
            }
            this.closeModal();
          } catch (e) {
            this.formError = e.message;
          } finally {
            this.saving = false;
          }
        },

        async confirmDeleteFood() {
          this.saving = true;
          try {
            await DB.deleteFood(this.user.uid, this.editingFoodId);
            this.foods = this.foods.filter(f => f.id !== this.editingFoodId);
            this.toast(this.t("toast_food_deleted"));
            this.closeModal();
          } catch (e) {
            this.formError = e.message;
          } finally {
            this.saving = false;
          }
        },

        // ── Food flag ─────────────────────────────────────────
        async toggleFoodFlag(food) {
          const newFlagged = !food.flagged;
          try {
            await DB.flagFood(this.user.uid, food.id, newFlagged);
            this.foods = this.foods.map(f => f.id === food.id ? { ...f, flagged: newFlagged } : f);
          } catch (e) {
            this.toast("Failed to update flag: " + e.message, "error");
          }
        },

        // ── Toasts ────────────────────────────────────────────
        toast(msg, type = "success") {
          const id = Math.random().toString(36).slice(2);
          this.toasts = [...this.toasts, { id, msg, type }];
          setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 3000);
        },
      });

      Alpine.start();
    </script>
  </body>
</html>
