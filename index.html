<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DietBudy – Sign In</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/app.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div x-data="authPage()" style="width: 100%; max-width: 560px">
      <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="6" y1="2" x2="6" y2="9"/>
            <line x1="9" y1="2" x2="9" y2="9"/>
            <path d="M6 9 Q7.5 12 9 9"/>
            <line x1="7.5" y1="12" x2="7.5" y2="22"/>
            <ellipse cx="16.5" cy="6" rx="2.5" ry="4"/>
            <line x1="16.5" y1="10" x2="16.5" y2="22"/>
          </svg>
          <span>DietBudy</span>
        </div>

        <!-- Language toggle -->
        <div style="display: flex; justify-content: flex-end; margin-bottom: 12px">
          <button
            class="btn btn-ghost btn-sm"
            @click="setLang(lang === 'en' ? 'bg' : 'en')"
            :title="lang === 'en' ? 'Switch to Bulgarian' : 'Смени на английски'"
            style="font-size: 0.75rem; font-weight: 700; padding: 4px 10px; letter-spacing: 0.5px"
            x-text="lang === 'en' ? 'EN' : 'BG'"
          ></button>
        </div>

        <!-- Error -->
        <div x-show="error" class="error-box" x-text="error"></div>

        <!-- Login form -->
        <div>
          <h2 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 4px" x-text="t('welcome_back')"></h2>
          <p style="color: var(--text3); font-size: 0.85rem; margin-bottom: 20px" x-text="t('sign_in_desc')"></p>
          <div class="form-group">
            <label class="form-label" x-text="t('label_email')"></label>
            <input type="email" x-model="email" @keyup.enter="login()" :placeholder="t('placeholder_email')" />
          </div>
          <div class="form-group">
            <label class="form-label" x-text="t('label_password')"></label>
            <input type="password" x-model="password" @keyup.enter="login()" :placeholder="t('placeholder_password')" />
          </div>
          <button
            class="btn btn-primary"
            style="width: 100%; justify-content: center; padding: 10px 16px"
            @click="login()"
            :disabled="loading"
          >
            <span x-show="!loading" x-text="t('btn_sign_in')"></span>
            <span x-show="loading" x-text="t('btn_signing_in')"></span>
          </button>
        </div>

      </div>
    </div>

    <script type="module">
      import Alpine from "https://cdn.jsdelivr.net/npm/alpinejs@3/dist/module.esm.js";
      import { auth } from "./js/firebase.js";
      import { translations } from "./js/i18n.js";
      import {
        signInWithEmailAndPassword,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

      // Redirect already-authenticated users immediately
      onAuthStateChanged(auth, (user) => {
        if (user) window.location.href = "./food-manager.html";
      });

      Alpine.data("authPage", () => ({
        email: "",
        password: "",
        loading: false,
        error: "",
        lang: localStorage.getItem("dietbudy-lang") || "en",

        t(key) {
          const tr = translations[this.lang] ?? translations.en;
          return tr[key] ?? translations.en[key] ?? key;
        },

        setLang(code) {
          this.lang = code;
          localStorage.setItem("dietbudy-lang", code);
        },

        async login() {
          this.error = "";
          if (!this.email || !this.password) {
            this.error = this.t("error_fill_fields");
            return;
          }
          this.loading = true;
          try {
            await signInWithEmailAndPassword(auth, this.email, this.password);
            // onAuthStateChanged fires → redirects to food-manager.html
          } catch (e) {
            this.error = this._friendly(e.code);
          } finally {
            this.loading = false;
          }
        },

        _friendly(code) {
          const map = {
            "auth/user-not-found":     this.t("error_user_not_found"),
            "auth/wrong-password":     this.t("error_wrong_password"),
            "auth/invalid-credential": this.t("error_invalid_credential"),
            "auth/too-many-requests":  this.t("error_too_many_requests"),
            "auth/network-request-failed": this.t("error_network"),
          };
          return map[code] ?? this.t("error_generic");
        },
      }));

      Alpine.start();
    </script>
  </body>
</html>
