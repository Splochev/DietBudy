<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DietBuddy – Meal Planner</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/app.css" />
    <style>
      .tab-btn {
        padding: 7px 14px;
        border-radius: var(--radius-sm);
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text3);
        transition: var(--trans);
        cursor: pointer;
        white-space: nowrap;
      }
      .tab-btn.active {
        background: var(--accent-bg);
        color: var(--accent);
        font-weight: 600;
      }
      .tab-btn:hover:not(.active) {
        background: var(--surface2);
        color: var(--text);
      }

      /* ── MEAL ITEM GRID ─────────────────────────── */
      /* Mobile-first: drag | food | [stats] | remove */
      .meal-item-grid {
        display: grid;
        grid-template-columns: 20px 1fr 58px;
        grid-template-rows: auto auto;
        row-gap: 4px;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
      }
      .meal-item-grid:last-child { border-bottom: none; }
      .meal-item-grid input {
        padding: 4px 8px;
        font-size: 0.8rem;
        width: 100%;
        text-align: center;
      }
      /* Mobile layout: drag handle spans rows 1-2 */
      .meal-item-grid > :nth-child(1) { grid-column: 1; grid-row: 1 / 3; align-self: center; }
      /* Food input in row 1 */
      .meal-item-grid > :nth-child(2) { grid-column: 2; grid-row: 1; }
      /* Stats row becomes a flex row in row 2 */
      .meal-item-grid > .item-stats-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        align-items: center;
        grid-column: 2;
        grid-row: 2;
      }
      .item-stats-row input { width: 62px; flex-shrink: 0; }
      .item-stats-row span { font-size: 0.78rem; }
      /* Remove button spans rows 1-2 */
      .meal-item-grid > :nth-child(4) { grid-column: 3; grid-row: 1 / 3; align-self: center; }

      /* Desktop: expand to full column grid */
      @media (min-width: 921px) {
        .meal-header-row { display: grid !important; }
        .meal-item-grid {
          grid-template-columns: 18px 1fr 100px 70px 75px 70px 70px 70px 58px;
          grid-template-rows: auto;
          row-gap: 0;
          padding: 8px 16px;
        }
        /* Reset mobile overrides */
        .meal-item-grid > :nth-child(1) { grid-column: auto; grid-row: auto; }
        .meal-item-grid > :nth-child(2) { grid-column: auto; grid-row: auto; }
        .meal-item-grid > :nth-child(4) { grid-column: auto; grid-row: auto; }
        /* stats row: display:contents so children flow into parent grid */
        .meal-item-grid > .item-stats-row { display: contents; }
        .col-cost5, .col-cost6 { display: block; }
      }
      @media (max-width: 920px) {
        .meal-header-row { display: none !important; }
        .col-cost5, .col-cost6 { display: none; }
      }

      .drag-over { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: var(--radius-sm); }
      .drag-handle { cursor: grab; color: var(--text3); display: flex; align-items: center; }
      .drag-handle:active { cursor: grabbing; }
      .meal-item-scratched { opacity: 0.45; }
      .meal-item-scratched .item-food-name { text-decoration: line-through; }
    </style>
  </head>
  <body>
    <div x-data x-init="$store.planner.init()" style="display:flex;flex-direction:column;height:100vh">

      <!-- ══ AUTH SCREEN ══════════════════════════════════════════ -->
      <template x-if="$store.planner.authState === 'unauthenticated'">
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg)">
          <div style="width:100%;max-width:480px">
            <div class="auth-card">
              <div class="auth-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="6" y1="2" x2="6" y2="9"/>
                  <line x1="9" y1="2" x2="9" y2="9"/>
                  <path d="M6 9 Q7.5 12 9 9"/>
                  <line x1="7.5" y1="12" x2="7.5" y2="22"/>
                  <ellipse cx="16.5" cy="6" rx="2.5" ry="4"/>
                  <line x1="16.5" y1="10" x2="16.5" y2="22"/>
                </svg>
                <span>DietBuddy</span>
              </div>
              <div x-show="$store.planner.authError" class="error-box" x-text="$store.planner.authError"></div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" x-model="$store.planner.authEmail" @keyup.enter="$store.planner.login()" placeholder="you@example.com" />
              </div>
              <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" x-model="$store.planner.authPassword" @keyup.enter="$store.planner.login()" placeholder="••••••••" />
              </div>
              <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px 16px"
                @click="$store.planner.login()" :disabled="$store.planner.authLoading">
                <span x-show="!$store.planner.authLoading">Sign In</span>
                <span x-show="$store.planner.authLoading">Signing in…</span>
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- ══ LOADING ══════════════════════════════════════════════ -->
      <template x-if="$store.planner.authState === 'loading'">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)">
          <div style="text-align:center;color:var(--text3)">
            <svg style="width:40px;height:40px;color:var(--accent);animation:pulse 1.5s infinite;margin-bottom:12px"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="6" y1="2" x2="6" y2="9"/>
              <line x1="9" y1="2" x2="9" y2="9"/>
              <path d="M6 9 Q7.5 12 9 9"/>
              <line x1="7.5" y1="12" x2="7.5" y2="22"/>
              <ellipse cx="16.5" cy="6" rx="2.5" ry="4"/>
              <line x1="16.5" y1="10" x2="16.5" y2="22"/>
            </svg>
            <p style="font-size:0.9rem">Loading…</p>
          </div>
        </div>
      </template>

      <!-- ══ APP SHELL ═════════════════════════════════════════════ -->
      <template x-if="$store.planner.authState === 'authenticated'">
        <div style="display:flex;flex-direction:column;height:100vh">

          <!-- ═ TOP BAR ═══════════════════════════════════════════ -->
          <header id="topbar" style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden">
            <button class="btn-icon" @click="$store.planner.sidebarOpen = !$store.planner.sidebarOpen" title="Toggle sidebar">
              <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>

            <div style="display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:700;color:var(--accent);letter-spacing:-0.5px;flex-shrink:0">
              <svg style="width:24px;height:24px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="6" y1="2" x2="6" y2="9"/>
                <line x1="9" y1="2" x2="9" y2="9"/>
                <path d="M6 9 Q7.5 12 9 9"/>
                <line x1="7.5" y1="12" x2="7.5" y2="22"/>
                <ellipse cx="16.5" cy="6" rx="2.5" ry="4"/>
                <line x1="16.5" y1="10" x2="16.5" y2="22"/>
              </svg>
              DietBuddy
            </div>

            <nav class="topbar-nav" style="display:flex;gap:4px;margin-left:8px">
              <a href="./food-manager.html"
                style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:4px;font-size:0.8rem;font-weight:500;color:var(--text3);text-decoration:none;transition:var(--trans)"
                onmouseover="this.style.color='var(--text)';this.style.background='var(--surface2)'"
                onmouseout="this.style.color='var(--text3)';this.style.background='transparent'">
                <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="6" y1="2" x2="6" y2="9"/>
                  <line x1="9" y1="2" x2="9" y2="9"/>
                  <path d="M6 9 Q7.5 12 9 9"/>
                  <line x1="7.5" y1="12" x2="7.5" y2="22"/>
                  <ellipse cx="16.5" cy="6" rx="2.5" ry="4"/>
                  <line x1="16.5" y1="10" x2="16.5" y2="22"/>
                </svg>
                <span x-text="$store.planner.t('nav_foods')"></span>
              </a>
              <a href="./planner.html"
                style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:4px;font-size:0.8rem;font-weight:500;color:var(--accent);background:var(--accent-bg);text-decoration:none">
                <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                  <line x1="8" y1="14" x2="16" y2="14"/>
                </svg>
                <span x-text="$store.planner.t('nav_planner')"></span>
              </a>
              <a href="https://splochev.github.io/GymBudy/workout.html"
                style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:4px;font-size:0.8rem;font-weight:500;color:var(--text3);text-decoration:none;transition:var(--trans)"
                onmouseover="this.style.color='var(--text)';this.style.background='var(--surface2)'"
                onmouseout="this.style.color='var(--text3)';this.style.background='transparent'">
                <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="9" width="3" height="6" rx="1"/>
                  <rect x="19" y="9" width="3" height="6" rx="1"/>
                  <rect x="5" y="7" width="3" height="10" rx="1"/>
                  <rect x="16" y="7" width="3" height="10" rx="1"/>
                  <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                <span x-text="$store.planner.t('nav_workouts')"></span>
              </a>
              <!-- Budget (cross-app) -->
              <a href="https://splochev.github.io/budgetBuddy/budget.html"
                style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:4px;font-size:0.8rem;font-weight:500;color:var(--text3);text-decoration:none;transition:var(--trans)"
                onmouseover="this.style.color='var(--text)';this.style.background='var(--surface2)'"
                onmouseout="this.style.color='var(--text3)';this.style.background='transparent'">
                <svg style="width:14px;height:14px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/>
                </svg>
                <span x-text="$store.planner.lang === 'bg' ? 'Бюджет' : 'Budget'"></span>
              </a>
            </nav>

            <div style="flex:1"></div>

            <!-- Save status -->
            <div x-show="$store.planner.activePlan" style="display:flex;align-items:center;gap:8px">
              <div style="display:flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--text3)">
                <div :class="$store.planner.saving ? 'dot-saving' : 'dot-saved'" class="save-dot"></div>
                <span x-text="$store.planner.saving ? $store.planner.t('saving') : $store.planner.t('saved')"></span>
              </div>
            </div>

            <!-- Lang toggle + User + logout -->
            <button class="btn btn-ghost btn-sm" style="font-size:0.75rem;padding:4px 10px"
              @click="$store.planner.setLang($store.planner.lang === 'en' ? 'bg' : 'en')"
              x-text="$store.planner.lang === 'en' ? 'EN' : 'BG'"></button>

            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:0.8rem;color:var(--text3)" x-text="$store.planner.user?.displayName || $store.planner.user?.email?.split('@')[0]"></span>
              <button class="btn-icon" @click="$store.planner.logout()" :title="$store.planner.t('sign_out')">
                <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                  <polyline points="16 17 21 12 16 7"/>
                  <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
              </button>
            </div>
          </header>

          <!-- ═ BODY ════════════════════════════════════════════════ -->
          <div style="display:flex;flex:1;overflow:hidden;position:relative">

            <!-- ═ SIDEBAR ════════════════════════════════════════ -->
            <aside id="sidebar" :class="{ open: $store.planner.sidebarOpen }"
              style="background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden">

              <!-- Mobile header -->
              <div class="sidebar-mobile-header" style="display:none;flex-direction:column;flex-shrink:0">
                <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)">
                  <div style="display:flex;align-items:center;gap:8px;font-size:1.1rem;font-weight:700;color:var(--accent)">
                    <svg style="width:22px;height:22px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="2" x2="6" y2="9"/><line x1="9" y1="2" x2="9" y2="9"/><path d="M6 9 Q7.5 12 9 9"/><line x1="7.5" y1="12" x2="7.5" y2="22"/><ellipse cx="16.5" cy="6" rx="2.5" ry="4"/><line x1="16.5" y1="10" x2="16.5" y2="22"/></svg>
                    DietBuddy
                  </div>
                  <button class="btn-icon" @click="$store.planner.sidebarOpen = false">
                    <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                  </button>
                </div>
                <div style="display:flex;flex-direction:column;padding:8px;border-bottom:1px solid var(--border);gap:2px">
                  <a href="./food-manager.html" style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius);color:var(--text3);font-size:0.875rem;font-weight:500;text-decoration:none">
                    <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="2" x2="6" y2="9"/><line x1="9" y1="2" x2="9" y2="9"/><path d="M6 9 Q7.5 12 9 9"/><line x1="7.5" y1="12" x2="7.5" y2="22"/><ellipse cx="16.5" cy="6" rx="2.5" ry="4"/><line x1="16.5" y1="10" x2="16.5" y2="22"/></svg>
                    <span x-text="$store.planner.t('nav_foods')"></span>
                  </a>
                  <a href="./planner.html" style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius);background:var(--accent-bg);color:var(--accent);font-size:0.875rem;font-weight:600;text-decoration:none">
                    <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/></svg>
                    <span x-text="$store.planner.t('nav_planner')"></span>
                  </a>
                  <a href="https://splochev.github.io/GymBudy/workout.html" style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius);color:var(--text3);font-size:0.875rem;font-weight:500;text-decoration:none">
                    <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="5" y="7" width="3" height="10" rx="1"/><rect x="16" y="7" width="3" height="10" rx="1"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    <span x-text="$store.planner.t('nav_workouts')"></span>
                  </a>
                  <a href="https://splochev.github.io/budgetBuddy/budget.html" style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius);color:var(--text3);font-size:0.875rem;font-weight:500;text-decoration:none">
                    <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/></svg>
                    <span x-text="$store.planner.lang === 'bg' ? 'Бюджет' : 'Budget'"></span>
                  </a>
                </div>
              </div>

              <!-- Meal Plans list -->
              <div style="padding:12px 16px;border-bottom:1px solid var(--border)">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                  <span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:600" x-text="$store.planner.t('meal_plans_sidebar')"></span>
                  <button class="btn-icon" style="width:24px;height:24px" title="New plan" @click="$store.planner.newPlan()">
                    <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                  </button>
                </div>
                <div style="display:flex;flex-direction:column;gap:2px">
                  <template x-for="plan in $store.planner.mealPlans" :key="plan.id">
                    <div class="sidebar-item" :title="plan.name" :class="{ active: $store.planner.activePlanId === plan.id }"
                      @click="$store.planner.loadPlan(plan.id)">
                      <span x-text="plan.name" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.85rem"></span>
                      <div class="item-actions">
                        <button class="btn-icon" style="width:22px;height:22px;color:var(--text3)" :title="$store.planner.t('duplicate_plan')"
                          @click.stop="$store.planner.duplicatePlan(plan.id)">
                          <svg style="width:12px;height:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2"/>
                            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                          </svg>
                        </button>
                        <button class="btn-icon" style="width:22px;height:22px;color:var(--danger)" title="Delete plan"
                          @click.stop="$store.planner.openModal('deletePlan', plan.id)">
                          <svg style="width:12px;height:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                          </svg>
                        </button>
                      </div>
                    </div>
                  </template>
                  <div x-show="!$store.planner.mealPlans.length" style="font-size:0.8rem;color:var(--text3);padding:8px 12px" x-text="$store.planner.t('no_plans_sidebar')"></div>
                </div>
              </div>

              <!-- Daily summary (if plan loaded) -->
              <div x-show="$store.planner.activePlan" style="padding:12px 16px;flex:1;overflow-y:auto">
                <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:600;margin-bottom:10px" x-text="$store.planner.t('daily_summary')"></div>
                <div style="display:flex;flex-direction:column;gap:8px">
                  <!-- Calories -->
                  <div>
                    <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:3px">
                      <span style="color:var(--text3)" x-text="$store.planner.t('calories_label')"></span>
                      <span :class="$store.planner.calorieClass" style="font-weight:600">
                        <span x-text="$store.planner.dailyTotals.calories"></span>
                        <span style="color:var(--text3)" x-show="$store.planner.activePlan?.targetCalories">
                          / <span x-text="$store.planner.activePlan?.targetCalories"></span>
                        </span>
                      </span>
                    </div>
                    <div class="progress-bar" x-show="$store.planner.activePlan?.targetCalories">
                      <div class="progress-fill" :class="$store.planner.calorieClass"
                        :style="'width:' + Math.min(($store.planner.dailyTotals.calories / ($store.planner.activePlan?.targetCalories || 1)) * 100, 100) + '%'"></div>
                    </div>
                  </div>
                  <!-- Protein -->
                  <div>
                    <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:3px">
                      <span style="color:var(--text3)" x-text="$store.planner.t('protein_label')"></span>
                      <span :class="$store.planner.proteinClass" style="font-weight:600">
                        <span x-text="$store.planner.dailyTotals.protein + 'g'"></span>
                        <span style="color:var(--text3)" x-show="$store.planner.activePlan?.targetProtein">
                          / <span x-text="$store.planner.activePlan?.targetProtein + 'g'"></span>
                        </span>
                      </span>
                    </div>
                    <div class="progress-bar" x-show="$store.planner.activePlan?.targetProtein">
                      <div class="progress-fill" :class="$store.planner.proteinClass"
                        :style="'width:' + Math.min(($store.planner.dailyTotals.protein / ($store.planner.activePlan?.targetProtein || 1)) * 100, 100) + '%'"></div>
                    </div>
                  </div>
                  <!-- Cost -->
                  <div style="display:flex;justify-content:space-between;font-size:0.8rem">
                    <span style="color:var(--text3)" x-text="$store.planner.t('daily_cost')"></span>
                    <span style="font-weight:600;color:var(--text2)" x-text="$store.planner.dailyTotals.cost ? $store.planner.dailyTotals.cost.toFixed(2) + ' €' : '—'"></span>
                  </div>
                  <div style="display:flex;justify-content:space-between;font-size:0.8rem">
                    <span style="color:var(--text3)">5-day cost</span>
                    <span style="color:var(--text2)" x-text="$store.planner.dailyTotals.cost ? ($store.planner.dailyTotals.cost * 5).toFixed(2) + ' €' : '—'"></span>
                  </div>
                  <div style="display:flex;justify-content:space-between;font-size:0.8rem">
                    <span style="color:var(--text3)">6-day cost</span>
                    <span style="color:var(--text2)" x-text="$store.planner.dailyTotals.cost ? ($store.planner.dailyTotals.cost * 6).toFixed(2) + ' €' : '—'"></span>
                  </div>
                  <div style="display:flex;justify-content:space-between;font-size:0.8rem">
                    <span style="color:var(--text3)">30-day cost</span>
                    <span style="color:var(--text2)" x-text="$store.planner.dailyTotals.cost ? ($store.planner.dailyTotals.cost * 30).toFixed(2) + ' €' : '—'"></span>
                  </div>
                </div>
              </div>

              <!-- Mobile user footer (pinned to bottom of drawer) -->
              <div class="sidebar-mobile-header"
                style="display:none;flex-direction:column;flex-shrink:0;border-top:1px solid var(--border);padding:12px 16px;gap:6px">
                <span style="font-size:0.78rem;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="$store.planner.user?.displayName || $store.planner.user?.email?.split('@')[0]"></span>
                <div style="display:flex;gap:6px;align-items:center">
                  <button class="btn btn-ghost btn-sm" style="font-size:0.75rem;padding:3px 8px"
                    @click="$store.planner.setLang($store.planner.lang === 'en' ? 'bg' : 'en')"
                    x-text="$store.planner.lang === 'en' ? 'EN' : 'BG'"></button>
                  <button class="btn-icon" @click="$store.planner.logout()" :title="$store.planner.t('sign_out')">
                    <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                      <polyline points="16 17 21 12 16 7"/>
                      <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                  </button>
                </div>
              </div>
            </aside>

            <!-- Mobile overlay — closes sidebar when tapped -->
            <div id="sidebar-overlay" @click="$store.planner.sidebarOpen = false"></div>

            <!-- ═ MAIN CONTENT ════════════════════════════════════ -->
            <main style="flex:1;overflow:auto">

              <!-- Empty state: no plan selected -->
              <template x-if="!$store.planner.activePlan">
                <div class="empty-state" style="height:100%">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                  <p style="font-size:1rem;font-weight:600;margin-bottom:6px" x-text="$store.planner.t('no_plan_selected')"></p>
                  <p style="font-size:0.85rem;margin-bottom:20px" x-text="$store.planner.t('no_plan_hint')"></p>
                  <button class="btn btn-primary" @click="$store.planner.newPlan()">
                    <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    <span x-text="$store.planner.t('btn_new_plan')"></span>
                  </button>
                </div>
              </template>

              <!-- Active plan editor -->
              <template x-if="$store.planner.activePlan">
                <div style="padding:clamp(12px, 3vw, 20px)">

                  <!-- Plan header / settings -->
                  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(12px,3vw,20px);margin-bottom:16px">
                    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
                      <div style="flex:1;min-width:0;width:100%">
                        <label class="form-label" x-text="$store.planner.t('plan_name_label')"></label>
                        <input x-model="$store.planner.activePlan.name" @input="$store.planner.debouncedSave()"
                          style="font-size:1rem;font-weight:600;background:transparent;border:1px solid transparent;padding:4px 8px;width:100%"
                          :placeholder="$store.planner.t('plan_name_placeholder')" />
                      </div>
                      <div style="display:flex;gap:10px;flex-wrap:wrap;width:100%;margin-top:8px">
                        <div style="flex:1;min-width:90px;max-width:150px">
                          <label class="form-label" x-text="$store.planner.t('target_calories_label')"></label>
                          <input type="number" x-model.number="$store.planner.activePlan.targetCalories"
                            @input="$store.planner.debouncedSave()" placeholder="2000" min="0" style="width:100%" />
                        </div>
                        <div style="flex:1;min-width:90px;max-width:150px">
                          <label class="form-label" x-text="$store.planner.t('target_protein_label')"></label>
                          <input type="number" x-model.number="$store.planner.activePlan.targetProtein"
                            @input="$store.planner.debouncedSave()" placeholder="150" min="0" style="width:100%" />
                        </div>
                        <div style="flex:1;min-width:70px;max-width:110px">
                          <label class="form-label" x-text="$store.planner.t('days_label')"></label>
                          <input type="number" x-model.number="$store.planner.activePlan.days"
                            @input="$store.planner.debouncedSave()" placeholder="5" min="1" max="365" style="width:100%" />
                        </div>
                        <button
                          x-show="$store.planner.undoCount > 0"
                          @click="$store.planner.undo()"
                          style="margin-left:auto;align-self:flex-end;display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--radius-sm);background:var(--surface3);color:var(--text2);font-size:0.78rem;font-weight:600;cursor:pointer;border:1px solid var(--border);white-space:nowrap;transition:var(--trans)"
                          onmouseover="this.style.background='var(--surface2)'"
                          onmouseout="this.style.background='var(--surface3)'">
                          <svg style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
                          <span x-text="$store.planner.t('undo')"></span>
                          <span style="opacity:0.6" x-text="'(' + $store.planner.undoCount + ')'"></span>
                        </button>
                    </div>
                  </div>

                  <!-- Tabs: Meals | Shopping List -->
                  <div style="display:flex;gap:4px;margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;width:fit-content;max-width:100%">
                    <button class="tab-btn" :class="{ active: $store.planner.tab === 'meals' }" @click="$store.planner.tab = 'meals'" x-text="'\uD83C\uDF7D\uFE0F ' + $store.planner.t('tab_meals')"></button>
                    <button class="tab-btn" :class="{ active: $store.planner.tab === 'shopping' }" @click="$store.planner.tab = 'shopping'" x-text="'\uD83D\uDED2 ' + $store.planner.t('tab_shopping')"></button>
                  </div>

                  <!-- ── TAB: MEALS ───────────────────────────────── -->
                  <template x-if="$store.planner.tab === 'meals'">
                    <div>
                      <!-- Daily stats bar -->
                      <div style="display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none">
                        <div class="stat-chip" :class="$store.planner.calorieClass">
                          <span class="stat-val" x-text="$store.planner.dailyTotals.calories"></span>
                          <span class="stat-label">
                            <span x-text="$store.planner.t('kcal_day')"></span>
                            <template x-if="$store.planner.activePlan.targetCalories">
                              <span x-text="' (' + $store.planner.t('target_label') + ' ' + $store.planner.activePlan.targetCalories + ')'"></span>
                            </template>
                          </span>
                        </div>
                        <div class="stat-chip" :class="$store.planner.proteinClass">
                          <span class="stat-val" x-text="$store.planner.dailyTotals.protein + 'g'"></span>
                          <span class="stat-label">
                            <span x-text="$store.planner.t('protein_day')"></span>
                            <template x-if="$store.planner.activePlan.targetProtein">
                              <span x-text="' (' + $store.planner.t('target_label') + ' ' + $store.planner.activePlan.targetProtein + 'g)'"></span>
                            </template>
                          </span>
                        </div>
                        <div class="stat-chip" x-show="$store.planner.dailyTotals.cost > 0">
                          <span class="stat-val" x-text="$store.planner.dailyTotals.cost.toFixed(2) + ' €'"></span>
                          <span class="stat-label" x-text="$store.planner.t('cost_day')"></span>
                        </div>
                        <div class="stat-chip" x-show="$store.planner.dailyTotals.cost > 0">
                          <span class="stat-val" x-text="($store.planner.dailyTotals.cost * 5).toFixed(2) + ' €'"></span>
                          <span class="stat-label">cost / 5 days</span>
                        </div>
                        <div class="stat-chip" x-show="$store.planner.dailyTotals.cost > 0">
                          <span class="stat-val" x-text="($store.planner.dailyTotals.cost * 6).toFixed(2) + ' €'"></span>
                          <span class="stat-label">cost / 6 days</span>
                        </div>
                        <div class="stat-chip" x-show="$store.planner.dailyTotals.cost > 0">
                          <span class="stat-val" x-text="($store.planner.dailyTotals.cost * 30).toFixed(2) + ' €'"></span>
                          <span class="stat-label">cost / 30 days</span>
                        </div>
                      </div>

                      <!-- Meals list -->
                      <template x-for="(meal, mealIdx) in $store.planner.activePlan.meals" :key="mealIdx">
                        <div class="meal-card" style="margin-bottom:14px"
                          draggable="true"
                          @dragstart="$store.planner.dragType = 'meal'; $store.planner.dragMealIdx = mealIdx; $event.dataTransfer.effectAllowed = 'move'"
                          @dragend="$store.planner.dragType = null"
                          @dragover.prevent="if ($store.planner.dragType === 'meal') { $event.currentTarget.classList.add('drag-over'); $event.dataTransfer.dropEffect = 'move' }"
                          @dragleave="$event.currentTarget.classList.remove('drag-over')"
                          @drop.prevent="$event.currentTarget.classList.remove('drag-over'); if ($store.planner.dragType === 'meal') $store.planner.reorderMeal($store.planner.dragMealIdx, mealIdx)">
                          <!-- Meal header -->
                          <div class="meal-card-header">
                            <div class="drag-handle" title="Drag to reorder meal">
                              <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="18" x2="16" y2="18"/>
                              </svg>
                            </div>
                            <div style="width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0"
                              x-text="mealIdx + 1"></div>
                            <input x-model="meal.name" @input="$store.planner.debouncedSave()"
                              style="font-size:0.9rem;font-weight:600;background:transparent;border:none;flex:1;min-width:0;padding:2px 4px"
                              placeholder="Meal name (e.g. Breakfast)" />
                            <!-- Meal totals -->
                            <div class="meal-totals" style="display:flex;gap:8px;font-size:0.75rem;color:var(--text3);flex-shrink:0;white-space:nowrap">
                              <span><span x-text="$store.planner.mealTotals(mealIdx).calories"></span> kcal</span>
                              <span style="color:var(--accent)"><span x-text="$store.planner.mealTotals(mealIdx).protein"></span>g P</span>
                            </div>
                            <button class="btn-icon" style="color:var(--danger);width:26px;height:26px;flex-shrink:0" title="Remove meal"
                              @click="$store.planner.removeMeal(mealIdx)">
                              <svg style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                            </button>
                          </div>

                            <!-- Column header for items -->
                          <div class="meal-item-grid meal-header-row" style="background:var(--surface2);padding-top:6px;padding-bottom:6px">
                            <span></span>
                            <span style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);font-weight:600" x-text="$store.planner.t('col_food')"></span>
                            <span style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);font-weight:600;text-align:center" x-text="$store.planner.t('col_qty')"></span>
                            <span style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);font-weight:600;text-align:center" x-text="$store.planner.t('col_kcal')"></span>
                            <span style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--accent);font-weight:600;text-align:center" x-text="$store.planner.t('protein_label')"></span>
                            <span class="col-cost" style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);font-weight:600;text-align:center" x-text="$store.planner.t('col_price')"></span>
                            <span class="col-cost5" style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);font-weight:600;text-align:center">×5d</span>
                            <span class="col-cost6" style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);font-weight:600;text-align:center">×6d</span>
                            <span></span>
                          </div>

                          <!-- Food items -->
                          <template x-for="(item, itemIdx) in meal.items" :key="itemIdx + ':' + item.foodId">
                            <div class="meal-item-grid" :class="{ 'meal-item-scratched': item.scratched }"
                              draggable="true"
                              @dragstart.stop="$store.planner.dragType = 'item'; $store.planner.dragItemKey = mealIdx + ':' + itemIdx; $event.dataTransfer.effectAllowed = 'move'"
                              @dragend.stop="$store.planner.dragType = null"
                              @dragover.prevent="if ($store.planner.dragType === 'item') { $event.stopPropagation(); $event.currentTarget.classList.add('drag-over'); $event.dataTransfer.dropEffect = 'move' }"
                              @dragleave="$event.currentTarget.classList.remove('drag-over')"
                              @drop.prevent="$event.currentTarget.classList.remove('drag-over'); if ($store.planner.dragType === 'item') { $event.stopPropagation(); $store.planner.reorderItem(mealIdx, parseInt($store.planner.dragItemKey?.split(':')[1]), itemIdx) }">
                              <!-- Drag handle -->
                              <span class="drag-handle" title="Drag to reorder">
                                <svg style="width:12px;height:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                  <line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="18" x2="16" y2="18"/>
                                </svg>
                              </span>
                              <!-- Food name (autocomplete) -->
                              <div style="position:relative" x-data="{ open: false, q: $store.planner.foodName(item.foodId) }">
                                <input :value="q"
                                  :class="item.scratched ? 'item-food-name' : ''"
                                  @input="q = $event.target.value; open = true"
                                  @focus="open = true"
                                  @blur="setTimeout(() => { open = false; if (!$store.planner.foodById(item.foodId)) q = '' }, 200)"
                                  @keydown.escape="open = false"
                                  placeholder="Search food…"
                                  style="width:100%;padding:4px 8px;font-size:0.8rem" />
                                <div x-show="open && q.length > 0" class="ac-dropdown">
                                  <template x-for="food in $store.planner.searchFoods(q)" :key="food.id">
                                    <div class="ac-item" @mousedown.prevent="item.foodId = food.id; q = food.name; open = false; $store.planner.debouncedSave()">
                                      <span x-text="food.name"></span>
                                      <span style="font-size:0.72rem;color:var(--accent)" x-text="food.protein + 'g P'"></span>
                                    </div>
                                  </template>
                                  <div x-show="!$store.planner.searchFoods(q).length" class="ac-item" style="color:var(--text3)">No foods found</div>
                                </div>
                              </div>

                              <!-- Quantity / Calories / Protein / Cost (wrapped for mobile row layout) -->
                              <div class="item-stats-row">
                              <!-- Quantity -->
                              <input type="number" x-model.number="item.quantity"
                                @input="$store.planner.debouncedSave()"
                                placeholder="100" min="0" step="1" style="text-align:center" />

                              <!-- Computed: Calories -->
                              <span style="text-align:center;color:var(--text2)" x-text="$store.planner.itemCalc(item).calories || '—'"></span>

                              <!-- Computed: Protein -->
                              <span style="text-align:center;color:var(--accent);font-weight:600" x-text="$store.planner.itemCalc(item).protein ? $store.planner.itemCalc(item).protein + 'g' : '—'"></span>

                              <!-- Computed: Cost -->
                              <span class="col-cost" style="text-align:center;color:var(--text3);font-size:0.8rem" x-text="$store.planner.itemCalc(item).cost != null ? $store.planner.itemCalc(item).cost.toFixed(2) + ' €' : '—'"></span>

                              <!-- Computed: Cost ×5 -->
                              <span class="col-cost5" style="text-align:center;color:var(--text3);font-size:0.8rem" x-text="$store.planner.itemCalc(item).cost != null ? ($store.planner.itemCalc(item).cost * 5).toFixed(2) + ' €' : '—'"></span>

                              <!-- Computed: Cost ×6 -->
                              <span class="col-cost6" style="text-align:center;color:var(--text3);font-size:0.8rem" x-text="$store.planner.itemCalc(item).cost != null ? ($store.planner.itemCalc(item).cost * 6).toFixed(2) + ' €' : '—'"></span>
                              </div>

                              <!-- Scratch + Remove -->
                              <div style="display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center">
                                <button class="btn-icon" style="width:24px;height:24px"
                                  :style="item.scratched ? 'color:var(--warning)' : 'color:var(--text3)'"
                                  :title="item.scratched ? $store.planner.t('restore_item_title') : $store.planner.t('scratch_item_title')"
                                  @click="item.scratched = !item.scratched; $store.planner.debouncedSave()">
                                  <svg style="width:12px;height:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <line x1="4" y1="20" x2="20" y2="4"/>
                                  </svg>
                                </button>
                                <button class="btn-icon" style="width:24px;height:24px;color:var(--danger)" title="Remove"
                                  @click="$store.planner.removeItem(mealIdx, itemIdx)">
                                  <svg style="width:12px;height:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                                </button>
                              </div>
                            </div>
                          </template>

                          <!-- Add food to meal -->
                          <div style="padding:10px 16px;border-top:1px solid var(--border)">
                            <button class="btn btn-ghost btn-sm" style="color:var(--accent)"
                              @click="meal.items.push({ foodId: '', quantity: 100 }); $store.planner.debouncedSave()">
                              <svg style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                              <span x-text="$store.planner.t('btn_add_food_meal')"></span>
                            </button>
                          </div>
                        </div>
                      </template>

                      <!-- Add meal -->
                      <button class="btn btn-secondary" @click="$store.planner.addMeal()">
                        <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                        <span x-text="$store.planner.t('btn_add_meal')"></span>
                      </button>
                    </div>
                  </template>

                  <!-- ── TAB: SHOPPING LIST ───────────────────────── -->
                  <template x-if="$store.planner.tab === 'shopping'">
                    <div>
                      <!-- Day selector -->
                      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;row-gap:8px">
                        <span style="font-size:0.85rem;color:var(--text3);white-space:nowrap" x-text="$store.planner.t('calculate_for')"></span>
                        <div style="display:flex;gap:6px">
                          <template x-for="d in [5, 6, 30]" :key="d">
                            <button class="btn btn-sm" :class="$store.planner.shopDays === d ? 'btn-primary' : 'btn-secondary'"
                              @click="$store.planner.shopDays = d" x-text="d + ' days'"></button>
                          </template>
                          <div style="display:flex;align-items:center;gap:6px">
                            <span style="font-size:0.8rem;color:var(--text3)">Custom:</span>
                            <input type="number" x-model.number="$store.planner.shopDays" min="1" max="365" style="width:60px;padding:4px 8px;font-size:0.8rem;text-align:center" />
                          </div>
                        </div>
                      </div>

                      <!-- Shopping table -->
                      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
                        <!-- Header -->
                        <div class="shop-row" style="background:var(--surface2)">
                          <span></span>
                          <span style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);font-weight:600" x-text="$store.planner.t('col_food')"></span>
                          <span class="col-pkg" style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);font-weight:600;text-align:center" x-text="$store.planner.t('shop_col_pkg')"></span>
                          <span style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);font-weight:600;text-align:center" x-text="$store.planner.t('shop_col_need')"></span>
                          <span style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--accent);font-weight:600;text-align:center" x-text="$store.planner.t('shop_col_buy')"></span>
                          <span style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);font-weight:600;text-align:center" x-text="$store.planner.t('shop_col_cost')"></span>
                        </div>

                        <template x-for="entry in $store.planner.shoppingList" :key="entry.foodId">
                          <div class="shop-row" :class="{ 'shop-checked': $store.planner.shopChecked[entry.foodId] }">
                            <div style="display:flex;align-items:center;justify-content:center">
                              <input type="checkbox"
                                :checked="$store.planner.shopChecked[entry.foodId]"
                                @change="$store.planner.shopChecked = { ...$store.planner.shopChecked, [entry.foodId]: $event.target.checked }"
                                style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0" />
                            </div>
                            <div>
                              <div class="shop-name" style="font-size:0.875rem;font-weight:500" x-text="entry.name"></div>
                              <div style="font-size:0.72rem;color:var(--text3)" x-text="entry.priceInfo"></div>
                            </div>
                            <div class="col-pkg" style="text-align:center;color:var(--text2);font-size:0.85rem" x-text="entry.packageWeight ? entry.packageWeight + 'g' : '—'"></div>
                            <div style="text-align:center">
                              <input type="number" x-model.number="entry.overrideGrams"
                                :placeholder="entry.totalGrams"
                                style="width:100%;text-align:center"
                                @input="$store.planner.updateShopEntry(entry)" />
                            </div>
                            <div style="text-align:center;font-weight:600;color:var(--accent)" x-text="entry.buyDisplay"></div>
                            <div style="text-align:center;color:var(--text2);font-size:0.85rem" x-text="entry.costDisplay"></div>
                          </div>
                        </template>

                        <div x-show="!$store.planner.shoppingList.length" class="empty-state" style="padding:40px">
                          <p style="font-size:0.9rem" x-text="$store.planner.t('no_shopping_foods')"></p>
                        </div>

                        <!-- Total row -->
                        <div x-show="$store.planner.shoppingList.length > 0"
                          style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--surface2);border-top:2px solid var(--border)">
                          <span style="font-weight:700;color:var(--text)" x-text="$store.planner.t('total_for') + ' ' + $store.planner.shopDays + $store.planner.t('days_suffix')"></span>
                          <span style="font-weight:700;color:var(--accent)" x-text="$store.planner.shoppingTotalCost > 0 ? $store.planner.shoppingTotalCost.toFixed(2) + ' €' : '—'"></span>
                        </div>
                      </div>
                    </div>
                  </template>

                </div>
              </template>
            </main>
          </div><!-- /body -->

          <!-- ═ MODALS ══════════════════════════════════════════════ -->

          <!-- Delete Plan Modal -->
          <template x-if="$store.planner.modal === 'deletePlan'">
            <div style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px" @click.self="$store.planner.closeModal()">
              <div class="modal-box" style="max-width:380px" @click.stop>
                <h2 style="font-size:1rem;font-weight:700;margin-bottom:8px" x-text="$store.planner.t('delete_plan_title')"></h2>
                <p style="color:var(--text3);font-size:0.875rem;margin-bottom:20px">
                  <span x-text="$store.planner.mealPlans.find(p=>p.id===$store.planner.deletingPlanId)?.name"></span>? <span x-text="$store.planner.t('confirm_delete_plan')"></span>
                </p>
                <div style="display:flex;gap:10px;justify-content:flex-end">
                  <button class="btn btn-secondary" @click="$store.planner.closeModal()" x-text="$store.planner.t('cancel')"></button>
                  <button class="btn btn-danger" @click="$store.planner.confirmDeletePlan()" :disabled="$store.planner.saving">
                    <span x-show="!$store.planner.saving" x-text="$store.planner.t('delete')"></span>
                    <span x-show="$store.planner.saving" x-text="$store.planner.t('deleting')"></span>
                  </button>
                </div>
              </div>
            </div>
          </template>

          <!-- ═ TOASTS ══════════════════════════════════════════════ -->
          <div style="position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:200">
            <template x-for="toast in $store.planner.toasts" :key="toast.id">
              <div class="toast" :class="toast.type === 'error' ? 'toast-error' : 'toast-success'" style="display:flex;align-items:center;gap:8px">
                <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <template x-if="toast.type !== 'error'"><path d="M20 6L9 17l-5-5"/></template>
                  <template x-if="toast.type === 'error'"><path d="M18 6L6 18M6 6l12 12"/></template>
                </svg>
                <span x-text="toast.msg" style="flex:1"></span>
                <button x-show="toast.undoable"
                  @click="$store.planner.undo(); $store.planner.toasts = $store.planner.toasts.filter(t => t.id !== toast.id)"
                  style="font-size:0.75rem;font-weight:700;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,0.18);color:inherit;cursor:pointer;border:none;white-space:nowrap;flex-shrink:0"
                  x-text="$store.planner.t('undo')"></button>
              </div>
            </template>
          </div>

        </div><!-- /app shell -->
      </template>
    </div><!-- /root -->

    <style>
      #sidebar { flex-shrink:0; width:0; overflow:hidden; transition: width 0.25s ease; }
      #sidebar.open { width: 280px; }

      /* Topbar: hide desktop nav + user text on mobile, keep hamburger + logo + save dot */
      @media (max-width: 920px) {
        .topbar-nav { display: none !important; }
        #topbar > *:nth-child(n + 5) { display: none !important; } /* hide lang, user, logout */
        #topbar { gap: 8px; padding: 10px 12px; }
        #sidebar { position:fixed; top:0; left:0; height:100vh; z-index:200; box-shadow:none; transition: width 0.25s ease, box-shadow 0.25s ease; }
        #sidebar.open { width: min(300px, 85vw); box-shadow: 4px 0 32px rgba(0,0,0,0.6); }
        #sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:199; }
        #sidebar.open ~ #sidebar-overlay, body:has(#sidebar.open) #sidebar-overlay { display:block; }
        .sidebar-mobile-header { display: flex !important; }
        /* Hide scrollbar on stat chips row */
        .stat-chips-row::-webkit-scrollbar { display: none; }
        /* Reduce stat chip min-width on mobile */
        .stat-chip { min-width: 76px; padding: 8px 12px; }
        /* Meal card header: allow totals to shrink/hide if needed */
        .meal-card-header { flex-wrap: wrap; }
        .meal-totals { font-size: 0.7rem; }
        /* Plan settings on mobile: full width stacking */
        .plan-settings-header { flex-direction: column !important; }
      }
      @media (min-width: 921px) { .sidebar-mobile-header { display: none !important; } }

      /* Ensure main and all children can't overflow viewport */
      main { min-width: 0; overflow-x: hidden; }
      .meal-card { min-width: 0; }
    </style>
    <script type="module">
      import Alpine from "https://cdn.jsdelivr.net/npm/alpinejs@3/dist/module.esm.js";
      import { auth } from "./js/firebase.js";
      import * as DB from "./js/db.js";
      import { calcItem, sumItems, statusClass, shoppingCalc, round, pricePer100g } from "./js/utils.js";
      import { translations } from "./js/i18n.js";
      import {
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

      // Debounce helper
      function debounce(fn, ms = 600) {
        let t;
        return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
      }

      Alpine.store("planner", {
        // ── Auth ──────────────────────────────────────────────
        authState: "loading",
        user: null,
        authEmail: "",
        authPassword: "",
        authLoading: false,
        authError: "",

        // ── Data ──────────────────────────────────────────────
        foods: [],
        mealPlans: [],

        // ── Active plan ───────────────────────────────────────
        activePlan: null,
        activePlanId: null,

        // ── UI ────────────────────────────────────────────────
        sidebarOpen: window.innerWidth >= 921,
        tab: "meals",          // meals | shopping | costs
        shopDays: 5,
        shopOverrides: {},     // foodId → overrideGrams
        shopChecked: {},       // foodId → boolean (in cart)
        saving: false,
        modal: null,
        deletingPlanId: null,
        toasts: [],
        dragMealIdx: null,
        dragItemKey: null,     // 'mealIdx:itemIdx'
        dragType: null,        // 'meal' | 'item'
        undoCount: 0,          // reactive: number of undo steps for current plan

        // ── i18n ──────────────────────────────────────────────
        lang: localStorage.getItem("dietbuddy-lang") || "en",
        t(key) { const tr = translations[this.lang] ?? translations.en; return tr[key] ?? translations.en[key] ?? key; },
        setLang(code) { this.lang = code; localStorage.setItem("dietbuddy-lang", code); },

        // ── Init ──────────────────────────────────────────────
        init() {
          this.debouncedSave = debounce(() => this._savePlan(), 800);

          onAuthStateChanged(auth, async (user) => {
            if (user) {
              this.user = user;
              this.authState = "authenticated";
              await this.loadData();
              // Auto-load plan from URL param, then last-used plan in Firestore
              const params = new URLSearchParams(window.location.search);
              const planId = params.get("plan");
              if (planId) {
                this.loadPlan(planId);
              } else {
                const lastId = await DB.getLastPlan(this.user.uid);
                const fallback = lastId || (this.mealPlans[0]?.id ?? null);
                if (fallback) this.loadPlan(fallback);
              }
            } else {
              this.user = null;
              this.authState = "unauthenticated";
            }
          });
        },

        async loadData() {
          try {
            const [foods, plans] = await Promise.all([
              DB.getFoods(this.user.uid),
              DB.getMealPlans(this.user.uid),
            ]);
            this.foods = foods;
            this.mealPlans = plans;
          } catch (e) {
            this.toast("Failed to load data: " + e.message, "error");
          }
        },

        // ── Auth ──────────────────────────────────────────────
        async login() {
          this.authError = "";
          if (!this.authEmail || !this.authPassword) { this.authError = "Please fill in all fields."; return; }
          this.authLoading = true;
          try {
            await signInWithEmailAndPassword(auth, this.authEmail, this.authPassword);
          } catch (e) {
            const map = {
              "auth/user-not-found": "No account with that email.",
              "auth/wrong-password": "Incorrect password.",
              "auth/invalid-credential": "Invalid email or password.",
              "auth/too-many-requests": "Too many attempts. Try again later.",
            };
            this.authError = map[e.code] ?? "Sign-in failed. Please try again.";
          } finally {
            this.authLoading = false;
          }
        },

        async logout() {
          await signOut(auth);
          this.foods = [];
          this.mealPlans = [];
          this.activePlan = null;
          this.activePlanId = null;
        },

        // ── Food helpers ──────────────────────────────────────
        get foodMap() {
          const m = {};
          for (const f of this.foods) m[f.id] = f;
          return m;
        },

        foodById(id) { return this.foodMap[id] || null; },

        foodName(id) {
          const f = this.foodById(id);
          return f ? f.name : "";
        },

        searchFoods(q) {
          if (!q) return [];
          const lower = q.toLowerCase();
          return this.foods.filter(f => f.name.toLowerCase().includes(lower)).slice(0, 12);
        },

        // ── Plan management ───────────────────────────────────
        newPlan() {
          this.activePlan = {
            name: "New Meal Plan",
            targetCalories: 2000,
            targetProtein: 150,
            days: 5,
            meals: [
              { name: "Breakfast", items: [] },
              { name: "Lunch",     items: [] },
              { name: "Dinner",    items: [] },
            ],
          };
          this.activePlanId = null;
          this.tab = "meals";
          this.shopOverrides = {};
          this._savePlan(); // create in Firestore immediately
        },

        loadPlan(id) {
          const plan = this.mealPlans.find(p => p.id === id);
          if (!plan) return;
          this.activePlan = JSON.parse(JSON.stringify(plan)); // deep clone
          this.activePlanId = id;
          this.shopOverrides = {};
          this.tab = "meals";
          this._syncUndoCount();
          if (this.user) DB.setLastPlan(this.user.uid, id).catch(() => {});
        },

        async duplicatePlan(id) {
          const plan = this.mealPlans.find(p => p.id === id);
          if (!plan) return;
          const clone = JSON.parse(JSON.stringify(plan));
          delete clone.id;
          clone.name = this.t('copy_of_prefix') + ' ' + plan.name;
          this.saving = true;
          try {
            const saved = await DB.saveMealPlan(this.user.uid, clone);
            this.mealPlans = [...this.mealPlans, saved];
            this.loadPlan(saved.id);
            this.toast(this.t('toast_plan_duplicated'));
          } catch (e) {
            this.toast('Duplicate failed: ' + e.message, 'error');
          } finally {
            this.saving = false;
          }
        },

        async _savePlan() {
          if (!this.activePlan || !this.user) return;
          this.saving = true;
          try {
            const planData = { ...this.activePlan };
            if (this.activePlanId) planData.id = this.activePlanId;
            // Strip transient scratch state before persisting
            planData.meals = (planData.meals || []).map(meal => ({
              ...meal,
              items: (meal.items || []).map(({ scratched, ...item }) => item),
            }));
            const saved = await DB.saveMealPlan(this.user.uid, planData);
            if (!this.activePlanId) {
              this.activePlanId = saved.id;
              this.activePlan = { ...this.activePlan, id: saved.id };
              this.mealPlans = [...this.mealPlans, saved];
            } else {
              this.mealPlans = this.mealPlans.map(p => p.id === this.activePlanId ? { ...p, ...planData } : p);
            }
          } catch (e) {
            this.toast("Save failed: " + e.message, "error");
          } finally {
            this.saving = false;
          }
        },

        addMeal() {
          const names = ["Breakfast","Lunch","Dinner","Snack","Pre-workout","Post-workout"];
          const existing = (this.activePlan.meals || []).map(m => m.name);
          const name = names.find(n => !existing.includes(n)) || `Meal ${(this.activePlan.meals?.length || 0) + 1}`;
          if (!this.activePlan.meals) this.activePlan.meals = [];
          this.activePlan.meals.push({ name, items: [] });
          this.debouncedSave();
        },

        removeMeal(idx) {
          this._pushUndo(this.t('undo_meal_removed'));
          this.activePlan.meals.splice(idx, 1);
          this.debouncedSave();
          this.toast(this.t('undo_meal_removed'), 'success', true);
        },

        reorderMeal(fromIdx, toIdx) {
          if (fromIdx === toIdx || fromIdx == null) return;
          const meals = [...this.activePlan.meals];
          const [moved] = meals.splice(fromIdx, 1);
          meals.splice(toIdx, 0, moved);
          this.activePlan.meals = meals;
          this.debouncedSave();
        },

        reorderItem(mealIdx, fromIdx, toIdx) {
          if (fromIdx === toIdx || fromIdx == null) return;
          const meals = JSON.parse(JSON.stringify(this.activePlan.meals));
          const [moved] = meals[mealIdx].items.splice(fromIdx, 1);
          meals[mealIdx].items.splice(toIdx, 0, moved);
          this.activePlan = { ...this.activePlan, meals };
          this.debouncedSave();
        },

        // ── Calculations ──────────────────────────────────────
        itemCalc(item) {
          const food = this.foodById(item.foodId);
          if (!food || !item.quantity) return { calories: 0, protein: 0, fats: 0, carbs: 0, cost: null };
          return calcItem(food, item.quantity);
        },

        mealTotals(mealIdx) {
          const meal = this.activePlan?.meals?.[mealIdx];
          if (!meal) return { calories: 0, protein: 0, fats: 0, carbs: 0, cost: 0 };
          return sumItems(meal.items.filter(i => !i.scratched), this.foodMap);
        },

        get dailyTotals() {
          if (!this.activePlan?.meals) return { calories: 0, protein: 0, fats: 0, carbs: 0, cost: 0 };
          const all = this.activePlan.meals.flatMap(m => m.items.filter(i => !i.scratched));
          return sumItems(all, this.foodMap);
        },

        get calorieClass() {
          return statusClass(this.dailyTotals.calories, this.activePlan?.targetCalories);
        },

        get proteinClass() {
          return statusClass(this.dailyTotals.protein, this.activePlan?.targetProtein);
        },

        get macroPercents() {
          const t = this.dailyTotals;
          const proteinKcal = t.protein * 4;
          const fatsKcal    = t.fats    * 9;
          const carbsKcal   = t.carbs   * 4;
          const total = proteinKcal + fatsKcal + carbsKcal;
          if (!total) return { proteinPct: 0, fatsPct: 0, carbsPct: 0 };
          return {
            proteinPct: round(proteinKcal / total * 100, 0),
            fatsPct:    round(fatsKcal    / total * 100, 0),
            carbsPct:   round(carbsKcal   / total * 100, 0),
          };
        },

        // ── Shopping list ─────────────────────────────────────
        get shoppingList() {
          if (!this.activePlan?.meals) return [];

          // Aggregate daily grams per food
          const dailyByFood = {};
          for (const meal of this.activePlan.meals) {
            for (const item of meal.items) {
              if (!item.foodId || !item.quantity) continue;
              dailyByFood[item.foodId] = (dailyByFood[item.foodId] || 0) + Number(item.quantity);
            }
          }

          return Object.entries(dailyByFood).map(([foodId, dailyGrams]) => {
            const food = this.foodById(foodId);
            if (!food) return null;
            const totalGrams = round(dailyGrams * this.shopDays, 0);
            const overrideGrams = this.shopOverrides[foodId] != null ? this.shopOverrides[foodId] : null;
            const gramsToUse = overrideGrams != null ? overrideGrams : totalGrams;

            // Packages needed
            let buyDisplay = "—";
            let costDisplay = "—";
            let cost = 0;

            if (food.packageWeight > 0) {
              const pkgs = round(gramsToUse / food.packageWeight, 2);
              buyDisplay = pkgs + " pkg";
              if (food.price > 0) {
                cost = round(pkgs * food.price, 2);
                costDisplay = cost.toFixed(2) + " €";
              }
            } else if (food.priceType === "per_kg" && food.price > 0) {
              const kgs = gramsToUse / 1000;
              cost = round(kgs * food.price, 2);
              costDisplay = cost.toFixed(2) + " €";
              buyDisplay = round(gramsToUse / 1000, 2) + " kg";
            }

            const pp = pricePer100g(food);
            const priceInfo = food.price > 0
              ? (food.priceType === "per_kg" ? food.price.toFixed(2) + " €/kg" : food.price.toFixed(2) + " €/pkg" + (food.packageWeight ? " (" + food.packageWeight + "g)" : ""))
              : "";

            return {
              foodId,
              name: food.name,
              packageWeight: food.packageWeight || 0,
              totalGrams,
              overrideGrams: overrideGrams,
              buyDisplay,
              costDisplay,
              priceInfo,
              _cost: cost,
            };
          }).filter(Boolean);
        },

        get shoppingTotalCost() {
          return round(this.shoppingList.reduce((s, e) => s + (e._cost || 0), 0), 2);
        },

        updateShopEntry(entry) {
          // Called when user changes the "Need (g)" input
          if (entry.overrideGrams === null || entry.overrideGrams === "" || isNaN(entry.overrideGrams)) {
            delete this.shopOverrides[entry.foodId];
          } else {
            this.shopOverrides[entry.foodId] = Number(entry.overrideGrams);
          }
        },

        // ── Undo ─────────────────────────────────────────────
        _UNDO_KEY: 'dietbuddy-undo',
        _UNDO_TTL: 3600000, // 1 hour in ms

        _syncUndoCount() {
          try {
            const raw = sessionStorage.getItem(this._UNDO_KEY);
            if (!raw) { this.undoCount = 0; return; }
            const now = Date.now();
            const all = JSON.parse(raw);
            this.undoCount = all.filter(e => e.planId === this.activePlanId && (now - e.ts) < this._UNDO_TTL).length;
          } catch { this.undoCount = 0; }
        },

        _pushUndo(label) {
          if (!this.activePlanId || !this.activePlan) return;
          try {
            const raw = sessionStorage.getItem(this._UNDO_KEY);
            let all = raw ? JSON.parse(raw) : [];
            const now = Date.now();
            // Prune expired
            all = all.filter(e => (now - e.ts) < this._UNDO_TTL);
            // Snapshot current meals BEFORE the deletion
            all.push({
              planId: this.activePlanId,
              meals: JSON.parse(JSON.stringify(this.activePlan.meals)),
              label,
              ts: now,
            });
            // Keep only last 5 per plan
            const forPlan = all.filter(e => e.planId === this.activePlanId);
            if (forPlan.length > 5) {
              let trimCount = forPlan.length - 5;
              all = all.filter(e => {
                if (e.planId === this.activePlanId && trimCount > 0) { trimCount--; return false; }
                return true;
              });
            }
            sessionStorage.setItem(this._UNDO_KEY, JSON.stringify(all));
            this._syncUndoCount();
          } catch {}
        },

        undo() {
          if (!this.activePlanId) return;
          try {
            const raw = sessionStorage.getItem(this._UNDO_KEY);
            if (!raw) return;
            let all = JSON.parse(raw);
            const now = Date.now();
            all = all.filter(e => (now - e.ts) < this._UNDO_TTL);
            // Find most recent entry for this plan
            let lastIdx = -1;
            for (let i = all.length - 1; i >= 0; i--) {
              if (all[i].planId === this.activePlanId) { lastIdx = i; break; }
            }
            if (lastIdx === -1) return;
            const entry = all[lastIdx];
            all.splice(lastIdx, 1);
            sessionStorage.setItem(this._UNDO_KEY, JSON.stringify(all));
            this.activePlan = { ...this.activePlan, meals: entry.meals };
            this.debouncedSave();
            this._syncUndoCount();
            this.toast(this.t('undo_restored'));
          } catch {}
        },

        removeItem(mealIdx, itemIdx) {
          this._pushUndo(this.t('undo_food_removed'));
          this.activePlan.meals[mealIdx].items.splice(itemIdx, 1);
          this.debouncedSave();
          this.toast(this.t('undo_food_removed'), 'success', true);
        },

        // ── Modal management ──────────────────────────────────
        openModal(name, id = null) {
          this.modal = name;
          this.deletingPlanId = id;
        },

        closeModal() {
          this.modal = null;
          this.deletingPlanId = null;
        },

        async confirmDeletePlan() {
          this.saving = true;
          try {
            await DB.deleteMealPlan(this.user.uid, this.deletingPlanId);
            this.mealPlans = this.mealPlans.filter(p => p.id !== this.deletingPlanId);
            if (this.activePlanId === this.deletingPlanId) {
              this.activePlan = null;
              this.activePlanId = null;
            }
            this.toast(this.t("toast_plan_deleted"));
            this.closeModal();
          } catch (e) {
            this.toast("Delete failed: " + e.message, "error");
          } finally {
            this.saving = false;
          }
        },

        // ── Toasts ────────────────────────────────────────────
        toast(msg, type = "success", undoable = false) {
          const id = Math.random().toString(36).slice(2);
          this.toasts = [...this.toasts, { id, msg, type, undoable }];
          setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, undoable ? 8000 : 3000);
        },
      });

      Alpine.start();
    </script>
  </body>
